[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eden_grasp_gen"
version = "0.1.7"
description = "GraspGen (diffusion-based 6-DOF grasp generation) for the Eden project: pure-Python inference"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-NVIDIA-License"
license-files = ["LICENSE", "LICENSE_ASSETS.md"]
authors = [
  {name = "Kashu Yamazaki", email = "kyamazak@andrew.cmu.edu"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# Inference needs only these, and every pin is a floor, so the package co-installs with
# downstream projects (Eden) instead of forcing exact versions. The released models run on a
# pure-PyTorch PTv3 (grasp_gen/models/ptv3/ptv3_vanilla.py): no spconv, no torch-scatter, and
# no CUDA extension to build. diffusers is not a dependency: its DDPMScheduler is vendored
# (grasp_gen/models/ddpm_scheduler.py) because every diffusers release caps huggingface-hub
# below 2.
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "scipy",
    "trimesh>=4.0",
    "yourdfpy>=0.0.56",
    "h5py",
    "omegaconf",
    "pyyaml",
    "tqdm",
    "addict",
    "timm>=1.0",
    "huggingface-hub>=0.25",
]

[project.optional-dependencies]
# Training, data generation and the scene (M2T2) model. The PointNet++ backbone compiles its
# CUDA ops on first use, with a CUDA toolkit that matches torch's.
train = [
    "hydra-core",
    "webdataset",
    "tensorboard",
    "tensorboardx",
    "pyrender",
    "transformers",
    "torch-geometric",
    "tensordict",
    "sharedarray",
    "matplotlib",
    "scikit-learn",
    "ninja",
]
# MeshCat visualization (grasp_gen.utils.meshcat_utils and the demo scripts).
vis = ["meshcat"]
# diffusers and spconv: the parity tests against them (they skip without).
dev = ["pytest", "diffusers"]

[project.urls]
"Repository" = "https://github.com/Kashu7100/GraspGen"
"Upstream" = "https://github.com/NVlabs/GraspGen"
"Eden" = "https://github.com/Kashu7100/Eden"

[tool.setuptools.packages.find]
where = ["."]
include = ["grasp_gen*"]

[tool.setuptools.package-data]
grasp_gen = [
    "config/grippers/*.yaml",
    "config/grippers/*.py",
    "assets/**/*",
    "pointnet2_ops/_ext-src/**/*",
]

[project.scripts]
grasp_gen = "grasp_gen._main:main"
